# Wave 4. Frontend LibreNMS (Deployment, replicas: 1 en lab, réduit de 2 pour
# contrainte RAM). initContainer wait-for-redis en FQDN point final (fiche #8).
# Service en sessionAffinity: ClientIP (fiche #10 : sinon sessions perdues si >1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librenms
  namespace: librenms
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librenms
      role: web
  template:
    metadata:
      labels:
        app: librenms
        role: web
    spec:
      initContainers:
        - name: wait-for-redis
          # TODO Nexus : busybox:1.36
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis.librenms.svc.cluster.local. 6379; do echo waiting-redis; sleep 2; done"
      containers:
        - name: librenms
          # TODO Nexus (cible prod 26.6.1) : librenms/librenms:26.6.1
          image: librenms/librenms:26.6.1
          envFrom:
            - configMapRef:
                name: librenms-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: APP_KEY
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: rrd
              mountPath: /data/rrd
          readinessProbe:
            httpGet:
              path: /login
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: rrd
          persistentVolumeClaim:
            claimName: librenms-rrd
---
apiVersion: v1
kind: Service
metadata:
  name: librenms
  namespace: librenms
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app: librenms
    role: web
  sessionAffinity: ClientIP
  ports:
    - port: 8000
      targetPort: 8000
