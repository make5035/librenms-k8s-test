# GABARITS — à renseigner puis CHIFFRER via SOPS avant tout commit.
# Ne jamais committer ce fichier en clair.
apiVersion: v1
kind: Secret
metadata:
  name: librenms-secret
  namespace: librenms
type: Opaque
stringData:
  db-username: librenms
  db-password: <MOT_DE_PASSE>
---
apiVersion: v1
kind: Secret
metadata:
  name: librenms-poller-secret
  namespace: librenms
type: Opaque
stringData:
  DB_HOST: "<IP_VM_MARIADB>"
  DB_NAME: "librenms"
  DB_USER: "librenms"
  DB_PASSWORD: "<MOT_DE_PASSE>"
  REDIS_HOST: "redis.librenms.svc.cluster.local."
  REDIS_PORT: "6379"
  APP_KEY: "<APP_KEY_BASE64>"
