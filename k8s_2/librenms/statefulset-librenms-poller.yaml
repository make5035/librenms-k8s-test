# Pollers/Dispatcher en StatefulSet — décision architecturale validée sur le
# cluster de lab (état réel en production de test).
# Justification :
#   - le service dispatcher enregistre chaque nœud dans la table poller_cluster
#     avec son identifiant (DISPATCHER_NODE_ID = nom du pod). Des identités
#     stables (librenms-poller-0, -1, -2...) évitent l'accumulation d'entrées
#     de pollers fantômes à chaque redéploiement ;
#   - le scale-down ordonné (n-1 en premier) permet un drain déterministe ;
#   - l'HPA scale nativement un StatefulSet (scaleTargetRef.kind: StatefulSet).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: librenms-poller
  namespace: librenms
  labels:
    app: librenms-poller
spec:
  serviceName: librenms-poller   # Service headless requis (voir service associé)
  replicas: 3
  selector:
    matchLabels:
      app: librenms-poller
  template:
    metadata:
      labels:
        app: librenms-poller
    spec:
      initContainers:
        - name: wait-for-redis
          image: repos-nexus.cpa-sante.priv/docker-group-repo/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z redis.librenms.svc.cluster.local. 6379; do sleep 2; done
        - name: generate-env
          image: repos-nexus.cpa-sante.priv/docker-group-repo/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cat > /data/.env <<ENV
              APP_KEY=${APP_KEY}
              DB_HOST=${DB_HOST}
              DB_DATABASE=${DB_NAME}
              DB_USERNAME=${DB_USER}
              DB_PASSWORD=${DB_PASSWORD}
              REDIS_HOST=${REDIS_HOST}
              REDIS_PORT=${REDIS_PORT}
              ENV
          envFrom:
            - secretRef:
                name: librenms-poller-secret
          volumeMounts:
            - name: poller-data
              mountPath: /data
      containers:
        - name: dispatcher
          image: repos-nexus.cpa-sante.priv/docker-group-repo/librenms/librenms:26.6.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: SIDECAR_DISPATCHER
              value: "1"
            - name: DISPATCHER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_DB
              value: "0"
            - name: REDIS_SCHEME
              value: "tcp"
          envFrom:
            - secretRef:
                name: librenms-poller-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: poller-data
              mountPath: /data
            - name: rrd
              mountPath: /opt/librenms/rrd
      volumes:
        - name: poller-data
          emptyDir: {}
        - name: rrd
          persistentVolumeClaim:
            claimName: rrd-pvc
