apiVersion: v1
kind: Service
metadata:
  name: librenms
  namespace: librenms
spec:
  selector:
    app: librenms
  # Erreur #10 documentée : persistance de session en multi-replica.
  # sessionPersistence HTTPRoute (cookie) non GA sur Cilium 1.15 —
  # l'affinité ClientIP au niveau Service reste la solution supportée.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: 80
      targetPort: 8000
