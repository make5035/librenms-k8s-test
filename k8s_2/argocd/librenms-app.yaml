# Application ArgoCD — pattern Hub and Spoke : ArgoCD tourne sur la VM Docker
# (192.168.98.134 en lab), hors du cluster qu'il pilote.
# Toute migration passe par le sync de cette Application, déclenché via
# l'INTERFACE WEB ArgoCD (SYNC -> SYNCHRONIZE) — kubectl est proscrit pour
# le déploiement (lecture seule tolérée), la CLI argocd n'est pas utilisée.
#
# Ordre de déploiement contrôlé par sync-waves (annotations à poser sur
# chaque manifest) :
#   wave 0 : namespace, PVC, Secrets
#   wave 1 : Redis, RRDcached (option B), Gateway
#   wave 2 : LibreNMS web, HTTPRoute
#   wave 3 : Pollers (StatefulSet), HPA
#   wave 4 : syslog-ng, snmptrapd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: librenms
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:make5035/librenms-k8s-test.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc   # cluster cible enregistré dans ArgoCD
    namespace: librenms
  syncPolicy:
    # Phases de migration : sync MANUEL par vague via l'UI web.
    # Passer en automated + selfHeal uniquement après validation Phase 5.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
