# Wave 4. Gateway API (GatewayClass cilium) remplace l'Ingress NGINX.
# MetalLB assigne une VIP du pool 192.168.98.240-250.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: librenms-gw
  namespace: librenms
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
