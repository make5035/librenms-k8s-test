# Wave 4. Pollers en StatefulSet (identités stables => pas d'entrées fantômes
# dans poller_cluster). DISPATCHER_NODE_ID dérivé du nom de pod. RRD partagé via
# le même PVC RWX (montage commun, pas de volumeClaimTemplate par pod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: librenms-poller
  namespace: librenms
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  serviceName: librenms-poller
  replicas: 1
  selector:
    matchLabels:
      app: librenms
      role: poller
  template:
    metadata:
      labels:
        app: librenms
        role: poller
    spec:
      initContainers:
        - name: wait-for-redis
          image: repos-nexus.cpa-sante.priv/docker-group-repo/library/busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis.librenms.svc.cluster.local. 6379; do sleep 2; done"
      containers:
        - name: poller
          image: repos-nexus.cpa-sante.priv/docker-group-repo/librenms/librenms:26.6.1
          env:
            - name: DISPATCHER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SIDECAR_DISPATCHER
              value: "1"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: APP_KEY
          envFrom:
            - configMapRef:
                name: librenms-config
          volumeMounts:
            - name: rrd
              mountPath: /data/rrd
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
      volumes:
        - name: rrd
          persistentVolumeClaim:
            claimName: librenms-rrd
---
apiVersion: v1
kind: Service
metadata:
  name: librenms-poller
  namespace: librenms
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  clusterIP: None
  selector:
    app: librenms
    role: poller
  ports:
    - port: 8000
      targetPort: 8000
