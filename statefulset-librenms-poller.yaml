# L'HPA scale nativement un StatefulSet. Le scale-down retire toujours le
# pod d'index le plus élevé, ce qui garantit un retrait déterministe des
# nœuds pollers dans poller_cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: librenms-poller-hpa
  namespace: librenms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: librenms-poller
  minReplicas: 3
  maxReplicas: 10       # ~1000 équipements par poller — 6 536 devices en prod
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
